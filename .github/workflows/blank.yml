# 汇编工程 CI 工作流
# 功能：检出代码 -> 汇编 hello.s -> 链接为可执行文件 -> 运行并校验输出
# 说明：源码为 32 位 AT&T 语法，使用 int $0x80 系统调用；
#       64 位 Linux 内核兼容该 32 位系统调用 ABI，故可直接在 ubuntu-latest 上构建运行。

name: CI

on:
  # 推送到 master 分支时触发
  push:
    branches: [ master ]
  # 向 master 分支发起 PR 时触发
  pull_request:
    branches: [ master ]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  build-and-run:
    name: Assemble, link and run hello.s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show as/ld version
        run: |
          as --version | head -n 1
          ld --version | head -n 1

      - name: Assemble hello.s
        run: as -o hello.o hello.s

      - name: Link to executable
        run: ld -o hello hello.o

      - name: Inspect artifact
        run: file hello

      - name: Run and verify output
        run: |
          output=$(./hello)
          echo "Program output: [$output]"
          expected="Hello World!"
          if [ "$output" = "$expected" ]; then
            echo "PASSED: output matches expected."
          else
            echo "FAILED: expected [$expected], got [$output]"
            exit 1
          fi
